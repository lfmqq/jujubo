# 生产环境配置 - 云服务器 106.54.237.201
# 线上经 nginx 等反向代理时，识别 X-Forwarded-* 头，使 request.getRemoteAddr() 返回真实客户端 IP
# （操作日志的真实 IP 解析主要在 IpUtil 中手动读取这些头，这里额外保证 Spring 内部一致）
server:
  forward-headers-strategy: native

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/manager_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: jujubo
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: redis
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD}
      database: 0
      timeout: 10000ms
  # 邮箱配置（用于发送邮箱验证码）
  mail:
    host: smtp.qq.com
    port: 587
    username: your-email@qq.com
    password: your-smtp-auth-code
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# 生产环境不打印 SQL（需要时改为 StdOutImpl）
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  # 默认激活开发环境，云服务器部署时改为 prod：--spring.profiles.active=prod
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.admin.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# jwt配置（所有环境共用）
jwt:
  secret: admin_yudao_1234567890_secret_key_2026
  expire: 86400000

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:jujubo-system}

# 和风天气配置（API Host 和 API KEY 均从和风天气控制台获取）
weather:
  qweather:
    enabled: ${QWEATHER_ENABLED:false}
    dynamic-location: ${QWEATHER_DYNAMIC_LOCATION:true}
    api-host: ${QWEATHER_API_HOST:}
    api-key: ${QWEATHER_API_KEY:}
    location-name: ${QWEATHER_LOCATION_NAME:北京}
    latitude: ${QWEATHER_LATITUDE:39.92}
    longitude: ${QWEATHER_LONGITUDE:116.41}
    forecast-days: ${QWEATHER_FORECAST_DAYS:5}
    cache-seconds: ${QWEATHER_CACHE_SECONDS:1800}
